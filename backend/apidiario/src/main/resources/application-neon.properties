# Opt-in: SPRING_PROFILES_ACTIVE=neon. Variables obligatorias, sin credenciales en Git.
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
diario.demo.enabled=false
diario.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
