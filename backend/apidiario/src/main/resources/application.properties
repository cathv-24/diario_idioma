spring.application.name=apidiario
# Configuracion privada del equipo; funciona al ejecutar desde la carpeta del proyecto.
spring.config.import=optional:file:./application-local.properties
# Uso local mientras aprendemos; no publicar esta etapa sin autenticacion.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_diario_idiomas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# Los DTO se construyen dentro del servicio, no con la sesion abierta en el controller.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
diario.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
diario.demo.enabled=true
logging.level.com.diario.apidiario=DEBUG
logging.file.name=logs/api.log
diario.automation.enabled=${N8N_ENABLED:false}
diario.automation.webhook-url=${N8N_WEBHOOK_URL:}
diario.automation.token=${N8N_WEBHOOK_TOKEN:}
