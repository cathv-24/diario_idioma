spring.application.name=apidiario

# ===== Base de datos PostgreSQL =====
# Crea la BD antes de arrancar:  CREATE DATABASE db_diario_idiomas;
# Credenciales por variables de entorno (con valores por defecto para desarrollo local).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_diario_idiomas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Motor de correccion =====
# Selecciona la implementacion de ServicioCorreccion: reglas | llm
diario.corrector=reglas
# (Solo se usa cuando diario.corrector=llm; ver CorrectorLLM)
diario.llm.api-key=

# ===== Logging =====
logging.level.root=INFO
logging.level.com.diario.apidiario=DEBUG
logging.file.name=logs/api.log
