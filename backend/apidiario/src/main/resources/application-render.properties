server.address=0.0.0.0
server.port=${PORT:10000}
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
diario.demo.enabled=false
diario.frontend-origin=${FRONTEND_ORIGIN:https://diario-idiomas.onrender.com}
server.servlet.session.cookie.secure=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.com.diario.apidiario=INFO
server.error.include-message=never
server.error.include-stacktrace=never
