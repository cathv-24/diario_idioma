# Perfil de prueba con base de datos H2 en memoria (no requiere PostgreSQL).
# Uso:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Los datos se pierden al apagar la app.

spring.datasource.url=jdbc:h2:mem:db_diario_idiomas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 en http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:db_diario_idiomas)
spring.h2.console.enabled=true
